name: Nex delivery router

on:
  workflow_dispatch:
  schedule:
    - cron: '17,47 * * * *'

# A GitHub App installation token handles writes, including workflow files.
# The repository GITHUB_TOKEN is not used to deliver changes.
permissions:
  contents: read

concurrency:
  group: nex-delivery-router
  cancel-in-progress: false

jobs:
  deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Install Drive client dependencies
        run: python -m pip install 'google-auth>=2.35,<3' 'requests>=2.32,<3'

      - name: Read and validate submission
        id: inbox
        env:
          DRIVE_READER_JSON: ${{ secrets.DRIVE_READER_JSON }}
          INBOX_DOC_ID: 18xbv9rQzAOyDvth7WCO2DeKW4TRXU8aeVcAow5VZMf0
        run: |
          cat > "$RUNNER_TEMP/nex_delivery.py" <<'PYTHON'
          import hashlib
          import json
          import os
          import re
          from pathlib import Path, PurePosixPath

          # A repository MUST be on this list AND in the GitHub App's selected installation.
          REPOSITORIES = {
              "bjornthorson/project-automation": ("BjornThorson/Project-automation", "main"),
              "bjornthorson/cyberpunk-launcher": ("BjornThorson/cyberpunk-launcher", "main"),
              "bjornthorson/deck-os-keyboard": ("BjornThorson/deck-os-keyboard", "main"),
              "bjornthorson/flatmmo-companion": ("BjornThorson/FlatMMO-Companion", "main"),
              "bjornthorson/forge-layout-lab": ("BjornThorson/forge-layout-lab", "main"),
              "bjornthorson/mystical-automation-unoffical-backport-1.20.1": ("BjornThorson/Mystical-Automation-Unoffical-Backport-1.20.1", "main"),
              "bjornthorson/phaser-rpg": ("BjornThorson/phaser-rpg", "master"),
              "bjornthorson/phaser-rpg-template": ("BjornThorson/phaser-rpg-template", "main"),
              "bjornthorson/pocket-capture": ("BjornThorson/pocket-capture", "main"),
              "bjornthorson/steph-s-cozy-shaders": ("BjornThorson/Steph-s-Cozy-Shaders", "main"),
              "bjornthorson/stray_frequency": ("BjornThorson/Stray_Frequency", "main"),
              "bjornthorson/test-typescript-game": ("BjornThorson/Test-TypeScript-Game", "main"),
              "bjornthorson/ts-online-game-template": ("BjornThorson/ts-online-game-template", "main"),
              "bjornthorson/vercel-test": ("BjornThorson/Vercel-Test", "main"),
          }
          FORBIDDEN_NAMES = {
              ".git", "node_modules", ".next", ".vercel", ".turbo", "dist",
              ".env", "secrets", "credentials", "__pycache__", ".ssh",
          }
          FORBIDDEN_SUFFIXES = {".pem", ".p12", ".pfx", ".key"}
          SAFE_PATH = re.compile(r"[A-Za-z0-9_./+@() -]+")
          SAFE_SUBMISSION_ID = re.compile(r"[a-z0-9][a-z0-9-]{4,63}")

          def output(name, value):
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
                  f.write(f"{name}={value}\n")

          def validate_path(value):
              if not isinstance(value, str) or len(value) > 240 or not SAFE_PATH.fullmatch(value):
                  raise ValueError("Invalid file path")
              p = PurePosixPath(value)
              if p.is_absolute() or str(p) != value or not p.parts or ".." in p.parts:
                  raise ValueError("Non-canonical destination path")
              if any(part.lower() in FORBIDDEN_NAMES for part in p.parts):
                  raise ValueError(f"Protected path: {value}")
              if any(part.startswith(".") for part in p.parts):
                  # Permit only GitHub Actions workflow declarations, not arbitrary GitHub settings.
                  if not (len(p.parts) == 3 and p.parts[:2] == (".github", "workflows")
                          and p.suffix in (".yml", ".yaml")):
                      raise ValueError(f"Hidden/configuration path requires explicit policy: {value}")
              if p.name.lower() in ("id_rsa", "id_ed25519", "credentials.json"):
                  raise ValueError("Credentials cannot be delivered")
              if p.suffix.lower() in FORBIDDEN_SUFFIXES:
                  raise ValueError("Key file cannot be delivered")
              return value

          def validate(item):
              if not isinstance(item, dict) or item.get("schema_version") != 2:
                  raise ValueError("Expected schema_version 2")
              if item.get("status") == "idle":
                  return None
              if item.get("status") != "ready":
                  raise ValueError("Submission status must be ready or idle")
              sid = item.get("submission_id")
              if not isinstance(sid, str) or not SAFE_SUBMISSION_ID.fullmatch(sid):
                  raise ValueError("Invalid submission ID")
              requested_repo = item.get("repository")
              if not isinstance(requested_repo, str) or requested_repo.casefold() not in REPOSITORIES:
                  raise ValueError("Repository is not allowlisted")
              repo, base = REPOSITORIES[requested_repo.casefold()]
              if item.get("base_branch") != base:
                  raise ValueError(f"Wrong base branch for {repo}, expected {base}")
              files = item.get("files")
              if not isinstance(files, list) or not 1 <= len(files) <= 20:
                  raise ValueError("Expected 1 to 20 files")
              seen, total_bytes = set(), 0
              for f in files:
                  if not isinstance(f, dict):
                      raise ValueError("Invalid file entry")
                  path = validate_path(f.get("path"))
                  if path in seen:
                      raise ValueError("Duplicate file path")
                  seen.add(path)
                  if f.get("operation") not in ("create", "update"):
                      raise ValueError("Only create and update operations are permitted")
                  if f.get("encoding") != "utf-8" or not isinstance(f.get("content"), str):
                      raise ValueError("Only UTF-8 text files are accepted")
                  data = f["content"].encode("utf-8")
                  total_bytes += len(data)
                  if len(data) > 65536 or total_bytes > 262144:
                      raise ValueError("Submission exceeds size limits")
                  expected = f.get("sha256")
                  if not isinstance(expected, str) or not re.fullmatch("[a-f0-9]{64}", expected):
                      raise ValueError("Invalid SHA-256")
                  if hashlib.sha256(data).hexdigest() != expected:
                      raise ValueError(f"SHA-256 mismatch: {path}")
                  if f["operation"] == "update":
                      previous = f.get("previous_sha256")
                      if not isinstance(previous, str) or not re.fullmatch("[a-f0-9]{64}", previous):
                          raise ValueError("Update requires previous_sha256")
              return repo, base, sid, [f["path"] for f in files]

          def main():
              from google.auth.transport.requests import AuthorizedSession
              from google.oauth2 import service_account
              secret = os.environ.get("DRIVE_READER_JSON")
              if not secret:
                  raise RuntimeError("Missing DRIVE_READER_JSON")
              credentials = service_account.Credentials.from_service_account_info(
                  json.loads(secret), scopes=["https://www.googleapis.com/auth/drive.readonly"]
              )
              response = AuthorizedSession(credentials).get(
                  f"https://www.googleapis.com/drive/v3/files/{os.environ['INBOX_DOC_ID']}/export",
                  params={"mimeType": "text/plain"}, timeout=30,
              )
              response.raise_for_status()
              if len(response.content) > 524288:
                  raise ValueError("Drive inbox too large")
              submission = json.loads(response.content.decode("utf-8-sig"))
              result = validate(submission)
              if result is None:
                  output("ready", "false")
                  print("Inbox idle")
                  return
              repo, base, sid, paths = result
              target = Path(os.environ["RUNNER_TEMP"]) / "nex-verified-submission.json"
              target.write_text(json.dumps(submission, ensure_ascii=False), encoding="utf-8")
              target.chmod(0o600)
              output("ready", "true")
              output("repository", repo)
              output("repo_name", repo.split("/", 1)[1])
              output("base_branch", base)
              output("submission_id", sid)
              output("branch", f"automation/nex-{sid}")
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
                  f.write("paths<<NEX_PATHS_END\n")
                  f.write("\n".join(paths))
                  f.write("\nNEX_PATHS_END\n")
              print(f"Validated {sid}: {len(paths)} files -> {repo}")

          if __name__ == "__main__":
              main()
          PYTHON
          python "$RUNNER_TEMP/nex_delivery.py"

      - name: Generate GitHub App token for destination
        id: app-token
        if: steps.inbox.outputs.ready == 'true'
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.NEX_APP_CLIENT_ID }}
          private-key: ${{ secrets.NEX_APP_PRIVATE_KEY }}
          owner: BjornThorson
          repositories: ${{ steps.inbox.outputs.repo_name }}
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write

      - name: Check out destination repository
        if: steps.inbox.outputs.ready == 'true'
        uses: actions/checkout@v7
        with:
          repository: ${{ steps.inbox.outputs.repository }}
          ref: ${{ steps.inbox.outputs.base_branch }}
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false

      - name: Apply verified files
        if: steps.inbox.outputs.ready == 'true'
        run: |
          python - <<'PYTHON'
          import hashlib
          import json
          import os
          from pathlib import Path
          submission = json.loads((Path(os.environ["RUNNER_TEMP"]) / "nex-verified-submission.json").read_text(encoding="utf-8"))
          root = Path.cwd().resolve()
          for f in submission["files"]:
              path = f["path"]
              data = f["content"].encode("utf-8")
              if hashlib.sha256(data).hexdigest() != f["sha256"]:
                  raise ValueError("Payload checksum changed")
              target = root / path
              if root not in target.resolve().parents:
                  raise ValueError("Destination escaped repository")
              if any(p.is_symlink() for p in [target, *target.parents] if p == root or root in p.parents):
                  raise ValueError("Symlinked destination rejected")
              exists = target.is_file()
              if f["operation"] == "create":
                  if target.exists():
                      if exists and target.read_bytes() == data:
                          print(f"Already present: {path}")
                          continue
                      raise ValueError(f"Create target exists: {path}")
              else:
                  if not exists:
                      raise ValueError(f"Update target missing: {path}")
                  old = target.read_bytes()
                  if hashlib.sha256(old).hexdigest() != f["previous_sha256"]:
                      if old == data:
                          print(f"Already updated: {path}")
                          continue
                      raise ValueError(f"Baseline SHA-256 mismatch: {path}")
                  if old == data:
                      print(f"Unchanged: {path}")
                      continue
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(data)
              if target.read_bytes() != data:
                  raise RuntimeError(f"Write verification failed: {path}")
              print(f"Verified file: {path}")
          PYTHON

      - name: Commit directly in setup mode
        if: steps.inbox.outputs.ready == 'true' && vars.NEX_SETUP_MODE == 'true'
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
          SUBMISSION_ID: ${{ steps.inbox.outputs.submission_id }}
          TARGET_BASE: ${{ steps.inbox.outputs.base_branch }}
        run: |
          set -euo pipefail
          python - <<'PYTHON'
          import json, os, subprocess
          from pathlib import Path
          item = json.loads((Path(os.environ["RUNNER_TEMP"]) / "nex-verified-submission.json").read_text(encoding="utf-8"))
          subprocess.run(["git", "add", "--", *[f["path"] for f in item["files"]]], check=True)
          PYTHON
          if git diff --cached --quiet; then
            echo 'Submission already applied: no commit needed.'
            exit 0
          fi
          git config user.name 'nex-project-automation[bot]'
          git config user.email 'nex-project-automation[bot]@users.noreply.github.com'
          git commit -m "chore: Nex delivery ${SUBMISSION_ID}"
          # The scoped App token is used only for this Git invocation, never written to git config.
          encoded_auth=$(printf 'x-access-token:%s' "$APP_TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${encoded_auth}" \
            push origin "HEAD:refs/heads/${TARGET_BASE}"
          echo 'Applied submission directly to destination default branch.'

      - name: Open pull request in review mode
        if: steps.inbox.outputs.ready == 'true' && vars.NEX_SETUP_MODE != 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ steps.app-token.outputs.token }}
          branch: ${{ steps.inbox.outputs.branch }}
          base: ${{ steps.inbox.outputs.base_branch }}
          title: 'Nex delivery: ${{ steps.inbox.outputs.submission_id }}'
          commit-message: 'chore: Nex delivery ${{ steps.inbox.outputs.submission_id }}'
          body: |
            Automated proposal submitted through the Nex delivery router.
            Destination, file paths, content digests and existing-file baselines were validated.
            Review and merge when appropriate.
          add-paths: ${{ steps.inbox.outputs.paths }}
