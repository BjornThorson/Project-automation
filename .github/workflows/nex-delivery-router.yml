name: Nex delivery router

on:
  workflow_dispatch:
  schedule:
    - cron: '17,47 * * * *'

# A GitHub App installation token handles writes, including workflow files.
# The repository GITHUB_TOKEN is not used to deliver changes.
permissions:
  contents: write
  actions: write

concurrency:
  group: nex-delivery-router
  cancel-in-progress: false

jobs:
  deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Install Drive client dependencies
        run: python -m pip install 'google-auth>=2.35,<3' 'requests>=2.32,<3'

      - name: Read and validate submission
        id: inbox
        env:
          DRIVE_READER_JSON: ${{ secrets.DRIVE_READER_JSON }}
          ROUTER_TOKEN: ${{ github.token }}
          INBOX_DOC_ID: 18xbv9rQzAOyDvth7WCO2DeKW4TRXU8aeVcAow5VZMf0
        run: |
          cat > "$RUNNER_TEMP/nex_delivery.py" <<'PYTHON'
          import hashlib
          import json
          import os
          import re
          import requests
          from pathlib import Path, PurePosixPath

          # A repository MUST be on this list AND in the GitHub App's selected installation.
          REPOSITORIES = {
              "bjornthorson/project-automation": ("BjornThorson/Project-automation", "testing"),
              "bjornthorson/cyberpunk-launcher": ("BjornThorson/cyberpunk-launcher", "testing"),
              "bjornthorson/deck-os-keyboard": ("BjornThorson/deck-os-keyboard", "testing"),
              "bjornthorson/flatmmo-companion": ("BjornThorson/FlatMMO-Companion", "testing"),
              "bjornthorson/forge-layout-lab": ("BjornThorson/forge-layout-lab", "testing"),
              "bjornthorson/mystical-automation-unoffical-backport-1.20.1": ("BjornThorson/Mystical-Automation-Unoffical-Backport-1.20.1", "testing"),
              "bjornthorson/phaser-rpg": ("BjornThorson/phaser-rpg", "testing"),
              "bjornthorson/phaser-rpg-template": ("BjornThorson/phaser-rpg-template", "testing"),
              "bjornthorson/pocket-capture": ("BjornThorson/pocket-capture", "testing"),
              "bjornthorson/steph-s-cozy-shaders": ("BjornThorson/Steph-s-Cozy-Shaders", "testing"),
              "bjornthorson/stray_frequency": ("BjornThorson/Stray_Frequency", "testing"),
              "bjornthorson/test-typescript-game": ("BjornThorson/Test-TypeScript-Game", "testing"),
              "bjornthorson/ts-online-game-template": ("BjornThorson/ts-online-game-template", "testing"),
              "bjornthorson/vercel-test": ("BjornThorson/Vercel-Test", "testing"),
          }
          FORBIDDEN_NAMES = {
              ".git", "node_modules", ".next", ".vercel", ".turbo", "dist",
              ".env", "secrets", "credentials", "__pycache__", ".ssh",
          }
          FORBIDDEN_SUFFIXES = {".pem", ".p12", ".pfx", ".key"}
          SAFE_PATH = re.compile(r"[A-Za-z0-9_./+@() -]+")
          SAFE_SUBMISSION_ID = re.compile(r"[a-z0-9][a-z0-9-]{4,63}")

          def output(name, value):
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
                  f.write(f"{name}={value}\n")

          def validate_path(value):
              if not isinstance(value, str) or len(value) > 240 or not SAFE_PATH.fullmatch(value):
                  raise ValueError("Invalid file path")
              p = PurePosixPath(value)
              if p.is_absolute() or str(p) != value or not p.parts or ".." in p.parts:
                  raise ValueError("Non-canonical destination path")
              if any(part.lower() in FORBIDDEN_NAMES for part in p.parts):
                  raise ValueError(f"Protected path: {value}")
              if any(part.startswith(".") for part in p.parts):
                  # Permit only GitHub Actions workflow declarations, not arbitrary GitHub settings.
                  if not (len(p.parts) == 3 and p.parts[:2] == (".github", "workflows")
                          and p.suffix in (".yml", ".yaml")):
                      raise ValueError(f"Hidden/configuration path requires explicit policy: {value}")
              if p.name.lower() in ("id_rsa", "id_ed25519", "credentials.json"):
                  raise ValueError("Credentials cannot be delivered")
              if p.suffix.lower() in FORBIDDEN_SUFFIXES:
                  raise ValueError("Key file cannot be delivered")
              return value

          def validate(item):
              if not isinstance(item, dict) or item.get("schema_version") != 2:
                  raise ValueError("Expected schema_version 2")
              if item.get("status") == "idle":
                  return None
              if item.get("status") != "ready":
                  raise ValueError("Submission status must be ready or idle")
              sid = item.get("submission_id")
              if not isinstance(sid, str) or not SAFE_SUBMISSION_ID.fullmatch(sid):
                  raise ValueError("Invalid submission ID")
              requested_repo = item.get("repository")
              if not isinstance(requested_repo, str) or requested_repo.casefold() not in REPOSITORIES:
                  raise ValueError("Repository is not allowlisted")
              repo, base = REPOSITORIES[requested_repo.casefold()]
              if item.get("base_branch") != base:
                  raise ValueError(f"Wrong base branch for {repo}, expected {base}")
              kind = item.get("kind", "files")
              if kind == "diagnostic":
                  if item.get("profile") not in ("npm-build", "npm-test", "playwright", "shader", "gradle"):
                      raise ValueError("Diagnostic profile not approved")
                  if item.get("ref") != base and not (repo.endswith("/FlatMMO-Companion") and item.get("ref") == "v2-online"):
                      raise ValueError("Diagnostic ref not approved")
                  return repo, base, sid, []
              if kind != "files":
                  raise ValueError("Unknown submission kind")
              files = item.get("files")
              if not isinstance(files, list) or not 1 <= len(files) <= 20:
                  raise ValueError("Expected 1 to 20 files")
              seen, total_bytes = set(), 0
              for f in files:
                  if not isinstance(f, dict):
                      raise ValueError("Invalid file entry")
                  path = validate_path(f.get("path"))
                  if path in seen:
                      raise ValueError("Duplicate file path")
                  seen.add(path)
                  if f.get("operation") not in ("create", "update"):
                      raise ValueError("Only create and update operations are permitted")
                  if f.get("encoding") != "utf-8" or not isinstance(f.get("content"), str):
                      raise ValueError("Only UTF-8 text files are accepted")
                  data = f["content"].encode("utf-8")
                  total_bytes += len(data)
                  if len(data) > 65536 or total_bytes > 262144:
                      raise ValueError("Submission exceeds size limits")
                  expected = f.get("sha256")
                  if not isinstance(expected, str) or not re.fullmatch("[a-f0-9]{64}", expected):
                      raise ValueError("Invalid SHA-256")
                  if hashlib.sha256(data).hexdigest() != expected:
                      raise ValueError(f"SHA-256 mismatch: {path}")
                  if f["operation"] == "update":
                      previous = f.get("previous_sha256")
                      if not isinstance(previous, str) or not re.fullmatch("[a-f0-9]{64}", previous):
                          raise ValueError("Update requires previous_sha256")
              return repo, base, sid, [f["path"] for f in files]

          def main():
              from google.auth.transport.requests import AuthorizedSession
              from google.oauth2 import service_account
              secret = os.environ.get("DRIVE_READER_JSON")
              if not secret:
                  raise RuntimeError("Missing DRIVE_READER_JSON")
              credentials = service_account.Credentials.from_service_account_info(
                  json.loads(secret), scopes=["https://www.googleapis.com/auth/drive.readonly"]
              )
              response = AuthorizedSession(credentials).get(
                  f"https://www.googleapis.com/drive/v3/files/{os.environ['INBOX_DOC_ID']}/export",
                  params={"mimeType": "text/plain"}, timeout=30,
              )
              response.raise_for_status()
              if len(response.content) > 524288:
                  raise ValueError("Drive inbox too large")
              submission = json.loads(response.content.decode("utf-8-sig"))
              # Queue v3 supports up to 50 append-only submission objects.
              # A durable receipt prevents a finished or failed job from replaying.
              if submission.get("schema_version") == 3:
                  if submission.get("status") not in ("active", "idle"):
                      raise ValueError("Invalid queue status")
                  entries = submission.get("queue")
                  if not isinstance(entries, list) or len(entries) > 50:
                      raise ValueError("Invalid queue contents")
                  chosen, ids = None, set()
                  for entry in entries:
                      if not isinstance(entry, dict):
                          raise ValueError("Malformed queue item")
                      sid = entry.get("submission_id")
                      if not isinstance(sid, str) or not SAFE_SUBMISSION_ID.fullmatch(sid) or sid in ids:
                          raise ValueError("Invalid or duplicated queued submission ID")
                      ids.add(sid)
                      if entry.get("status") != "ready" or submission["status"] == "idle":
                          continue
                      receipt_url = ("https://api.github.com/repos/BjornThorson/Project-automation"
                                     f"/contents/automation/receipts/{sid}.json")
                      # Read old receipts from main and new receipts from a dedicated ledger.
                      existing_receipt = False
                      for ledger_ref in ("main", "nex-receipts"):
                          lookup = requests.get(receipt_url, headers={
                              "Authorization": "Bearer " + os.environ["ROUTER_TOKEN"],
                              "Accept": "application/vnd.github+json"
                          }, params={"ref": ledger_ref}, timeout=20)
                          if lookup.status_code == 200:
                              existing_receipt = True
                              break
                          if lookup.status_code != 404:
                              lookup.raise_for_status()
                      if existing_receipt:
                          continue
                      chosen = entry
                      break
                  submission = chosen or {"schema_version": 2, "status": "idle"}
              result = validate(submission)
              if result is None:
                  output("ready", "false")
                  print("Inbox idle")
                  return
              repo, base, sid, paths = result
              target = Path(os.environ["RUNNER_TEMP"]) / "nex-verified-submission.json"
              target.write_text(json.dumps(submission, ensure_ascii=False), encoding="utf-8")
              target.chmod(0o600)
              output("ready", "true")
              output("kind", submission.get("kind", "files"))
              output("profile", submission.get("profile", ""))
              output("diagnostic_ref", submission.get("ref", ""))
              output("repository", repo)
              output("repo_name", repo.split("/", 1)[1])
              output("base_branch", base)
              output("submission_id", sid)
              output("branch", f"automation/nex-{sid}")
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
                  f.write("paths<<NEX_PATHS_END\n")
                  f.write("\n".join(paths))
                  f.write("\nNEX_PATHS_END\n")
              print(f"Validated {sid}: {len(paths)} files -> {repo}")

          if __name__ == "__main__":
              main()
          PYTHON
          python "$RUNNER_TEMP/nex_delivery.py"

      - name: Generate GitHub App token for destination
        id: app-token
        if: steps.inbox.outputs.ready == 'true' && steps.inbox.outputs.kind == 'files'
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.NEX_APP_CLIENT_ID }}
          private-key: ${{ secrets.NEX_APP_PRIVATE_KEY }}
          owner: BjornThorson
          repositories: ${{ steps.inbox.outputs.repo_name }}
          permission-contents: write
          permission-workflows: write

      - name: Check out destination repository
        if: steps.inbox.outputs.ready == 'true' && steps.inbox.outputs.kind == 'files'
        uses: actions/checkout@v7
        with:
          repository: ${{ steps.inbox.outputs.repository }}
          ref: ${{ steps.inbox.outputs.base_branch }}
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false

      - name: Apply verified files
        if: steps.inbox.outputs.ready == 'true' && steps.inbox.outputs.kind == 'files'
        run: |
          python - <<'PYTHON'
          import hashlib
          import json
          import os
          from pathlib import Path
          submission = json.loads((Path(os.environ["RUNNER_TEMP"]) / "nex-verified-submission.json").read_text(encoding="utf-8"))
          root = Path.cwd().resolve()
          for f in submission["files"]:
              path = f["path"]
              data = f["content"].encode("utf-8")
              if hashlib.sha256(data).hexdigest() != f["sha256"]:
                  raise ValueError("Payload checksum changed")
              target = root / path
              if root not in target.resolve().parents:
                  raise ValueError("Destination escaped repository")
              if any(p.is_symlink() for p in [target, *target.parents] if p == root or root in p.parents):
                  raise ValueError("Symlinked destination rejected")
              exists = target.is_file()
              if f["operation"] == "create":
                  if target.exists():
                      if exists and target.read_bytes() == data:
                          print(f"Already present: {path}")
                          continue
                      raise ValueError(f"Create target exists: {path}")
              else:
                  if not exists:
                      raise ValueError(f"Update target missing: {path}")
                  old = target.read_bytes()
                  if hashlib.sha256(old).hexdigest() != f["previous_sha256"]:
                      if old == data:
                          print(f"Already updated: {path}")
                          continue
                      raise ValueError(f"Baseline SHA-256 mismatch: {path}")
                  if old == data:
                      print(f"Unchanged: {path}")
                      continue
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(data)
              if target.read_bytes() != data:
                  raise RuntimeError(f"Write verification failed: {path}")
              print(f"Verified file: {path}")
          PYTHON

      - name: Commit validated files to testing
        if: steps.inbox.outputs.ready == 'true' && steps.inbox.outputs.kind == 'files'
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
          SUBMISSION_ID: ${{ steps.inbox.outputs.submission_id }}
          TARGET_BASE: ${{ steps.inbox.outputs.base_branch }}
        run: |
          set -euo pipefail
          python - <<'PYTHON'
          import json, os, subprocess
          from pathlib import Path
          item = json.loads((Path(os.environ["RUNNER_TEMP"]) / "nex-verified-submission.json").read_text(encoding="utf-8"))
          subprocess.run(["git", "add", "--", *[f["path"] for f in item["files"]]], check=True)
          PYTHON
          if git diff --cached --quiet; then
            echo 'Submission already applied: no commit needed.'
            exit 0
          fi
          git config user.name 'nex-project-automation[bot]'
          git config user.email 'nex-project-automation[bot]@users.noreply.github.com'
          git commit -m "chore: Nex delivery ${SUBMISSION_ID}"
          # The scoped App token is used only for this Git invocation, never written to git config.
          encoded_auth=$(printf 'x-access-token:%s' "$APP_TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${encoded_auth}" \
            push origin "HEAD:refs/heads/${TARGET_BASE}"
          echo 'Applied submission directly to destination default branch.'

      - name: Dispatch approved diagnostic
        if: steps.inbox.outputs.ready == 'true' && steps.inbox.outputs.kind == 'diagnostic'
        env:
          GH_AUTH: ${{ github.token }}
          TARGET_REPO: ${{ steps.inbox.outputs.repo_name }}
          PROFILE: ${{ steps.inbox.outputs.profile }}
          REF: ${{ steps.inbox.outputs.diagnostic_ref }}
        run: |
          python - <<'PYTHON'
          import os, requests
          url = "https://api.github.com/repos/BjornThorson/Project-automation/actions/workflows/nex-diagnostics.yml/dispatches"
          response = requests.post(url, headers={"Authorization": "Bearer " + os.environ["GH_AUTH"], "Accept": "application/vnd.github+json"},
                                   json={"ref": "main", "inputs": {"repository": os.environ["TARGET_REPO"], "profile": os.environ["PROFILE"], "ref": os.environ["REF"]}}, timeout=20)
          response.raise_for_status()
          print("Diagnostic run dispatched.")
          PYTHON

      - name: Save delivery receipt
        if: always() && steps.inbox.outputs.ready == 'true'
        env:
          GH_AUTH: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
          SID: ${{ steps.inbox.outputs.submission_id }}
          DESTINATION: ${{ steps.inbox.outputs.repository }}
          KIND: ${{ steps.inbox.outputs.kind }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python - <<'PYTHON'
          import os, json, base64, datetime, requests
          sid = os.environ["SID"]
          status = "completed" if os.environ["JOB_STATUS"] == "success" else "failed"
          receipt = {"schema_version": 1, "submission_id": sid, "status": status,
                     "kind": os.environ["KIND"], "repository": os.environ["DESTINATION"],
                     "workflow_run": os.environ["RUN_URL"],
                     "completed_at": datetime.datetime.now(datetime.timezone.utc).isoformat()}
          repo_api = "https://api.github.com/repos/BjornThorson/Project-automation"
          ledger_branch = "nex-receipts"
          url = f"{repo_api}/contents/automation/receipts/{sid}.json"
          headers = {"Authorization": "Bearer " + os.environ["GH_AUTH"], "Accept": "application/vnd.github+json"}
          # Receipt-only branch; keeping audit commits away from protected main.
          branch_url = f"{repo_api}/git/ref/heads/{ledger_branch}"
          ref = requests.get(branch_url, headers=headers, timeout=20)
          if ref.status_code == 404:
              main_ref = requests.get(f"{repo_api}/git/ref/heads/main", headers=headers, timeout=20)
              main_ref.raise_for_status()
              create = requests.post(f"{repo_api}/git/refs", headers=headers,
                  json={"ref": f"refs/heads/{ledger_branch}",
                        "sha": main_ref.json()["object"]["sha"]}, timeout=20)
              if create.status_code == 422:
                  confirm = requests.get(branch_url, headers=headers, timeout=20)
                  confirm.raise_for_status()
              else:
                  create.raise_for_status()
          else:
              ref.raise_for_status()
          previous = requests.get(url, headers=headers, params={"ref": ledger_branch}, timeout=20)
          if previous.status_code == 200:
              # Receipt outcomes are immutable: do not overwrite an earlier result.
              print(f"Receipt already exists on {ledger_branch}: {sid}")
          else:
              if previous.status_code != 404:
                  previous.raise_for_status()
              body = {"message": f"chore: receipt for {sid}", "branch": ledger_branch,
                      "content": base64.b64encode((json.dumps(receipt, indent=2) + "\n").encode()).decode()}
              write = requests.put(url, headers=headers, json=body, timeout=20)
              write.raise_for_status()
              confirm = requests.get(url, headers=headers, params={"ref": ledger_branch}, timeout=20)
              confirm.raise_for_status()
              print(f"Saved {status} receipt for {sid} on {ledger_branch}")
          PYTHON
