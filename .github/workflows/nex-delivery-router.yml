name: Nex delivery router

on:
  workflow_dispatch:
  schedule:
    # Twice per hour. Scheduled workflows may start late on GitHub-hosted runners.
    - cron: '17,47 * * * *'

# The hub uses its own GITHUB_TOKEN only when delivering to Project-automation.
# Other repositories use an installation token scoped to the selected destination.
permissions:
  contents: write
  pull-requests: write

concurrency:
  group: nex-delivery-router
  cancel-in-progress: false

jobs:
  deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Install Drive client dependencies
        run: python -m pip install 'google-auth>=2.35,<3' 'requests>=2.32,<3'

      - name: Read and validate submission
        id: inbox
        env:
          DRIVE_READER_JSON: ${{ secrets.DRIVE_READER_JSON }}
          INBOX_DOC_ID: 18xbv9rQzAOyDvth7WCO2DeKW4TRXU8aeVcAow5VZMf0
        run: |
          cat > "$RUNNER_TEMP/nex_delivery.py" <<'PYTHON'
          import hashlib
          import json
          import os
          import re
          from pathlib import Path, PurePosixPath

          # Explicit allowlist. A repository must ALSO have a GitHub App installation
          # (except the hub itself), otherwise the scoped token request will fail.
          REPOSITORIES = {
              "bjornthorson/project-automation": ("BjornThorson/Project-automation", "main"),
              "bjornthorson/cyberpunk-launcher": ("BjornThorson/cyberpunk-launcher", "main"),
              "bjornthorson/deck-os-keyboard": ("BjornThorson/deck-os-keyboard", "main"),
              "bjornthorson/flatmmo-companion": ("BjornThorson/FlatMMO-Companion", "main"),
              "bjornthorson/forge-layout-lab": ("BjornThorson/forge-layout-lab", "main"),
              "bjornthorson/mystical-automation-unoffical-backport-1.20.1": ("BjornThorson/Mystical-Automation-Unoffical-Backport-1.20.1", "main"),
              "bjornthorson/phaser-rpg": ("BjornThorson/phaser-rpg", "master"),
              "bjornthorson/phaser-rpg-template": ("BjornThorson/phaser-rpg-template", "main"),
              "bjornthorson/pocket-capture": ("BjornThorson/pocket-capture", "main"),
              "bjornthorson/steph-s-cozy-shaders": ("BjornThorson/Steph-s-Cozy-Shaders", "main"),
              "bjornthorson/stray_frequency": ("BjornThorson/Stray_Frequency", "main"),
              "bjornthorson/test-typescript-game": ("BjornThorson/Test-TypeScript-Game", "main"),
              "bjornthorson/ts-online-game-template": ("BjornThorson/ts-online-game-template", "main"),
              "bjornthorson/vercel-test": ("BjornThorson/Vercel-Test", "main"),
          }

          DISALLOWED_PARTS = {
              ".github", ".git", "node_modules", ".next", ".vercel", ".turbo",
              "dist", ".env", "secrets", "credentials", "__pycache__",
          }
          DISALLOWED_SUFFIXES = {".pem", ".p12", ".pfx", ".key"}
          SAFE_PATH = re.compile(r"[A-Za-z0-9_./+@() -]+")
          SAFE_SUBMISSION_ID = re.compile(r"[a-z0-9][a-z0-9-]{4,63}")

          def output(key, value):
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as stream:
                  stream.write(f"{key}={value}\n")

          def check_path(path):
              if not isinstance(path, str) or len(path) > 240 or not SAFE_PATH.fullmatch(path):
                  raise ValueError("Invalid file path")
              posix = PurePosixPath(path)
              if path.startswith("/") or str(posix) != path or len(posix.parts) < 1:
                  raise ValueError("Non-canonical file path")
              if any(part in (".", "..") or part.startswith(".") or part.lower() in DISALLOWED_PARTS
                     for part in posix.parts):
                  raise ValueError(f"Protected file path: {path}")
              if posix.name.lower() in ("id_rsa", "id_ed25519", "credentials.json"):
                  raise ValueError("Key or credential file cannot be submitted")
              if posix.suffix.lower() in DISALLOWED_SUFFIXES:
                  raise ValueError("Key files cannot be submitted")
              return path

          def validate(submission):
              if not isinstance(submission, dict) or submission.get("schema_version") != 2:
                  raise ValueError("Expected schema_version 2")
              if submission.get("status") == "idle":
                  return None
              if submission.get("status") != "ready":
                  raise ValueError("Submission status must be 'ready' or 'idle'")
              sid = submission.get("submission_id")
              if not isinstance(sid, str) or not SAFE_SUBMISSION_ID.fullmatch(sid):
                  raise ValueError("Invalid submission ID")
              requested_repo = submission.get("repository")
              if not isinstance(requested_repo, str) or requested_repo.casefold() not in REPOSITORIES:
                  raise ValueError("Repository is not approved")
              repository, base = REPOSITORIES[requested_repo.casefold()]
              if submission.get("base_branch") != base:
                  raise ValueError(f"Incorrect base branch, expected {base}")
              files = submission.get("files")
              if not isinstance(files, list) or not (1 <= len(files) <= 20):
                  raise ValueError("Expected 1 to 20 files")
              seen, total_bytes = set(), 0
              for f in files:
                  if not isinstance(f, dict):
                      raise ValueError("Malformed file entry")
                  path = check_path(f.get("path"))
                  if path in seen:
                      raise ValueError("Duplicate file path")
                  seen.add(path)
                  if f.get("operation") not in ("create", "update"):
                      raise ValueError("Only create/update operations are allowed")
                  if f.get("encoding") != "utf-8" or not isinstance(f.get("content"), str):
                      raise ValueError("Only UTF-8 text files are supported")
                  raw = f["content"].encode("utf-8")
                  total_bytes += len(raw)
                  if len(raw) > 65536 or total_bytes > 262144:
                      raise ValueError("File or submission exceeds size limit")
                  digest = f.get("sha256")
                  if not isinstance(digest, str) or not re.fullmatch(r"[a-f0-9]{64}", digest):
                      raise ValueError("Invalid SHA-256 field")
                  if hashlib.sha256(raw).hexdigest() != digest:
                      raise ValueError(f"SHA-256 mismatch for {path}")
                  if f["operation"] == "update":
                      previous = f.get("previous_sha256")
                      if not isinstance(previous, str) or not re.fullmatch(r"[a-f0-9]{64}", previous):
                          raise ValueError("Updates require previous_sha256 to prevent overwriting concurrent edits")
              return repository, base, sid, [f["path"] for f in files]

          def main():
              from google.auth.transport.requests import AuthorizedSession
              from google.oauth2 import service_account

              secret = os.getenv("DRIVE_READER_JSON")
              if not secret:
                  raise RuntimeError("Missing DRIVE_READER_JSON secret")
              credentials = service_account.Credentials.from_service_account_info(
                  json.loads(secret),
                  scopes=["https://www.googleapis.com/auth/drive.readonly"],
              )
              session = AuthorizedSession(credentials)
              response = session.get(
                  f"https://www.googleapis.com/drive/v3/files/{os.environ['INBOX_DOC_ID']}/export",
                  params={"mimeType": "text/plain"},
                  timeout=30,
              )
              response.raise_for_status()
              if len(response.content) > 524288:
                  raise ValueError("Inbox document exceeds 512 KiB")
              submission = json.loads(response.content.decode("utf-8-sig"))
              result = validate(submission)
              if result is None:
                  print("Inbox idle: no delivery required")
                  output("ready", "false")
                  return
              repository, base, sid, paths = result
              queue_path = Path(os.environ["RUNNER_TEMP"]) / "nex-verified-submission.json"
              queue_path.write_text(json.dumps(submission, ensure_ascii=False), encoding="utf-8")
              queue_path.chmod(0o600)
              output("ready", "true")
              output("repository", repository)
              output("repo_name", repository.split("/", 1)[1])
              output("base_branch", base)
              output("submission_id", sid)
              output("branch", f"automation/nex-{sid}")
              output("use_app", "false" if repository.casefold() == "bjornthorson/project-automation" else "true")
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as stream:
                  stream.write("paths<<NEX_PATHS_END\n")
                  stream.write("\n".join(paths))
                  stream.write("\nNEX_PATHS_END\n")
              print(f"Validated {sid}: {len(paths)} files for {repository}")

          if __name__ == "__main__":
              main()
          PYTHON
          python "$RUNNER_TEMP/nex_delivery.py"

      - name: Get token scoped to target repository
        id: app-token
        if: steps.inbox.outputs.ready == 'true' && steps.inbox.outputs.use_app == 'true'
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.NEX_APP_CLIENT_ID }}
          private-key: ${{ secrets.NEX_APP_PRIVATE_KEY }}
          owner: BjornThorson
          repositories: ${{ steps.inbox.outputs.repo_name }}
          permission-contents: write
          permission-pull-requests: write

      - name: Checkout destination repository
        if: steps.inbox.outputs.ready == 'true'
        uses: actions/checkout@v7
        with:
          repository: ${{ steps.inbox.outputs.repository }}
          ref: ${{ steps.inbox.outputs.base_branch }}
          token: ${{ steps.app-token.outputs.token || github.token }}
          persist-credentials: false

      - name: Apply verified files
        if: steps.inbox.outputs.ready == 'true'
        run: |
          python - <<'PYTHON'
          import hashlib
          import json
          import os
          from pathlib import Path

          manifest = json.loads((Path(os.environ["RUNNER_TEMP"]) / "nex-verified-submission.json").read_text(encoding="utf-8"))
          root = Path.cwd().resolve()

          # Every file was previously validated and approved for this repository.
          # No submitted code is executed by the delivery workflow.
          for file in manifest["files"]:
              path = file["path"]
              data = file["content"].encode("utf-8")
              if hashlib.sha256(data).hexdigest() != file["sha256"]:
                  raise ValueError("In-memory payload differs from manifest")
              target = root / path
              resolved = target.resolve()
              if root not in resolved.parents:
                  raise ValueError("Destination escaped repository")
              if any(p.is_symlink() for p in [target] + list(target.parents) if p == root or root in p.parents):
                  raise ValueError("Symlinked destination path disallowed")

              existing = target.is_file()
              if file["operation"] == "create":
                  if target.exists():
                      if existing and target.read_bytes() == data:
                          print(f"Already present: {path}")
                          continue
                      raise ValueError(f"Create target exists: {path}")
              else:
                  if not existing:
                      raise ValueError(f"Update target not found: {path}")
                  old = target.read_bytes()
                  if hashlib.sha256(old).hexdigest() != file["previous_sha256"]:
                      if old == data:
                          print(f"Already updated: {path}")
                          continue
                      raise ValueError(f"Baseline checksum changed: {path}")
                  if old == data:
                      print(f"No changes: {path}")
                      continue

              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(data)
              if target.read_bytes() != data:
                  raise RuntimeError(f"Post-write verification failed: {path}")
              print(f"Verified file: {path}")
          PYTHON

      - name: Open pull request in destination
        if: steps.inbox.outputs.ready == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ steps.app-token.outputs.token || github.token }}
          branch: ${{ steps.inbox.outputs.branch }}
          base: ${{ steps.inbox.outputs.base_branch }}
          title: 'Nex delivery: ${{ steps.inbox.outputs.submission_id }}'
          commit-message: 'chore: Nex delivery ${{ steps.inbox.outputs.submission_id }}'
          body: |
            Automated proposal staged from an ordinary ChatGPT conversation.
            Target repository and file paths were allowlisted and SHA-256 verified.
            Review the changes before merging. This workflow never merges PRs.
          add-paths: ${{ steps.inbox.outputs.paths }}
